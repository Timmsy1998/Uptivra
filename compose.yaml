name: uptivra
x-backend: &backend
  image: uptivra-api:local
  build: .
  environment: &backend-env
    DATABASE_URL: postgres://uptivra:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/uptivra?sslmode=disable
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
    CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET}
  restart: unless-stopped
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uptivra
      POSTGRES_USER: uptivra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U uptivra -d uptivra]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: migrate
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    command: serve
    depends_on:
      migrate: {condition: service_completed_successfully}
  scheduler:
    <<: *backend
    command: schedule
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build: ./web
    environment:
      API_ORIGIN: http://api:8080
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres-data:
