name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uptivra_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:integration-test-only@localhost:5432/uptivra_test?sslmode=disable
      DATABASE_URL: postgres://postgres:integration-test-only@localhost:5432/uptivra_test?sslmode=disable
      APP_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:8080
      ADMIN_EMAIL: browser@example.com
      ADMIN_PASSWORD: browser-test-password-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go formatting, static analysis and transactional tests
        run: |
          test -z "$(gofmt -l api cmd internal examples/go)"
          go mod verify
          go vet ./...
          go test -race -count=1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          go build -trimpath -o /tmp/uptivra ./cmd/uptivra
      - name: Frontend verification
        run: |
          npm --prefix web ci
          npm --prefix web audit --audit-level=moderate
          npm --prefix web run format:check
          npm --prefix web run typecheck
          npm --prefix web run build
      - name: Compose configuration
        env:
          POSTGRES_PASSWORD: configuration-test-only
          ENCRYPTION_KEY: configuration-test-only
          CRON_SECRET: configuration-test-only
        run: docker compose config --quiet
      - name: Browser dependencies
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser workflows against real services
        shell: bash
        run: |
          set -euo pipefail
          export ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export CRON_SECRET="$(openssl rand -hex 32)"
          /tmp/uptivra migrate
          /tmp/uptivra bootstrap
          /tmp/uptivra serve > /tmp/uptivra-api.log 2>&1 &
          api_pid=$!
          cp -r web/.next/static web/.next/standalone/.next/static
          cp -r web/public web/.next/standalone/public
          HOSTNAME=127.0.0.1 PORT=3000 node web/.next/standalone/server.js > /tmp/uptivra-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/healthz >/dev/null && curl --fail --silent http://localhost:3000/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/uptivra-api.log /tmp/uptivra-web.log
            exit 1
          fi
          npm --prefix web run test:e2e
      - name: Browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: |
            web/test-results
            /tmp/uptivra-api.log
            /tmp/uptivra-web.log
          retention-days: 7
